[package]
name = "eov-common"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Thomas Havlik <me@thavlik.dev>"]
license = "MIT OR Apache-2.0 OR GPL-3.0-only"
description = "Common utilities and abstractions for the EOV project, including WSI handling, image processing, caching, and math utilities."
keywords = ["wsi", "biology", "pathology"]
repository = "https://github.com/eosin-platform/eov"
homepage = "https://eov.sh"
readme = "README.md"
publish = true
build = "build.rs"
# Links libopenslide (>= 4.0) itself; see build.rs.
links = "openslide"

[lib]
name = "eov_common"
path = "src/lib.rs"

[dependencies]
# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Streaming export encoders (PNG pHYs/text chunks; Deflate for TIFF strips)
png = "0.18"
flate2 = "1"
# Font rendering for overlays
ab_glyph = "0.2"
# Thread-safe caching
dashmap = "6"
parking_lot = "0.12"
# Error handling
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
# Math utilities
glam = "0.30"
# Parallel iteration
rayon = "1"
# Serialization (dataset metadata)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
# Platform directories (see `paths`)
dirs = "6"
# OME-TIFF reader (see `ome_tiff`): OME-XML, and the TIFF codecs eov
# decodes itself (Deflate comes from `flate2` above).
roxmltree = "0.21"
weezl = "0.1"
zune-jpeg = "0.5"
zstd = { version = "0.13", default-features = false }

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Validates the canonical WGSL shipped in `processing::wgsl`.
naga = { version = "29", features = ["wgsl-in"] }
# Decodes exported TIFFs in tests.
tiff = "0.10"

[features]
default = []
# Exposes `test_support` (synthetic slide writers) to other crates' tests.
test-support = []

[[bench]]
name = "wsi_benchmarks"
harness = false
