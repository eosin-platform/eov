[package]
name = "eov-common"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Thomas Havlik <me@thavlik.dev>"]
license = "MIT OR Apache-2.0 OR GPL-3.0"
description = "Common utilities and abstractions for the EOV project, including WSI handling, image processing, caching, and math utilities."
keywords = ["wsi", "biology", "pathology"]
repository = "https://github.com/eosin-platform/eov"
homepage = "https://eov.sh"
readme = "README.md"
publish = true
build = "build.rs"
# Links libopenslide (>= 4.0) itself; see build.rs.
links = "openslide"

[lib]
name = "eov_common"
path = "src/lib.rs"

[dependencies]
# Image processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Font rendering for overlays
ab_glyph = "0.2"
# Thread-safe caching
dashmap = "6"
parking_lot = "0.12"
# Error handling
thiserror = "2"
anyhow = "1"
# Logging
tracing = "0.1"
# Math utilities
glam = "0.30"
# Parallel iteration
rayon = "1"
# Serialization (dataset metadata)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
sha2 = "0.10"
# Platform directories (see `paths`)
dirs = "6"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[features]
default = []

[[bench]]
name = "wsi_benchmarks"
harness = false
