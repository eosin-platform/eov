[package]
name = "eov"
version = "1.0.0"
edition = "2024"
default-run = "eov"
authors = ["Thomas Havlik <me@thavlik.dev>"]
license = "MIT OR Apache-2.0 OR GPL-3.0-only"
description = "Main application for the EOV project, providing a Slint user interface and integrating various functionalities from the common crate."
keywords = ["wsi", "biology", "pathology", "medical", "histology"]
homepage = "https://eov.sh"
repository = "https://github.com/eosin-platform/eov"
readme = "README.md"
publish = true

[[bin]]
name = "eov"
path = "src/main.rs"

[[bin]]
name = "eov-update-helper"
path = "src/update_helper.rs"

# The Windows console launcher, shipped as `eov.com` next to `eov.exe` in the
# portable release (see src/win_console_launcher.rs).
[[bin]]
name = "eov-console"
path = "src/win_console_launcher.rs"
required-features = ["windows-console-launcher"]

[dependencies]
# Common crate
eov-common = { path = "../common", version = "1.0.0" }

# Plugin API
eov-plugin-api = { path = "../plugin_api", version = "1.0.0" }

# Stable ABI for dynamic plugin loading
abi_stable = { version = "0.11", default-features = false }

# CLI parsing
clap = { version = "4.6", features = ["derive"] }

# Slint UI
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    # Draws the window when no GPU adapter is usable (RND-4).
    "renderer-software",
    "unstable-wgpu-29",
    "unstable-winit-030",
] }

# The interpreter's property and callback types (same pinned version as the
# interpreter uses).
i-slint-compiler = { version = "=1.17.1", default-features = false }

# Slint interpreter for runtime plugin UI loading
slint-interpreter = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "internal",
    "internal-json",
] }

wgpu = { version = "28.0.0" }

# Image handling
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
sha2 = "0.10"
# Authenticates the single-instance messages (the same hmac zip uses).
hmac = "0.12"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
natord = "1"

# File dialogs
rfd = "0.17.2"

# Thread-safe state
parking_lot = "0.12"

# Concurrent data structures
crossbeam-channel = "0.5.17"
dashmap = "6"
rayon = "1.12"

# CLI progress bars
indicatif = "0.18"

# Ctrl-C handling
ctrlc = "3"

# Clipboard
arboard = "3"

# Process management (for Open Containing Folder)
open = "5"

# Config directory access
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tar = "0.4"
# zstd-compressed `.eop` plugin packages (decoder only).
zstd = { version = "0.13", default-features = false }
# Random, race-free temporary files and directories for staging.
tempfile = "3"
# Verification of minisign signatures on release manifests.
minisign-verify = "0.3"
semver = { version = "1", features = ["serde"] }
url = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# TLS roots for the updater: Mozilla's bundle plus the OS certificate store
# (enterprise TLS inspection), see update/transport.rs.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
rustls-native-certs = "0.8"
zip = "2"

# Overlay layers: spatial index, rasterisation, lock-free snapshots
rstar = "0.13"
tiny-skia = "0.11"
arc-swap = "1"
dunce = "1"

# GPU vertex buffer casting
bytemuck = { version = "1", features = ["derive"] }

# UUID for filter IDs
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
raw-window-handle = "0.6"
# org.freedesktop.FileManager1.ShowItems for "Open Containing Folder" (the
# same zbus Slint's winit backend already uses).
zbus = { version = "5.14", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
eov-common = { path = "../common", features = ["test-support"] }
eov-example-plugin = { path = "../plugin_api/example-plugin" }
i-slint-backend-testing = { version = "1.17.1" }
# Validates the viewer's WGSL (the same naga as wgpu's).
naga = { version = "29", features = ["wgsl-in"] }

[features]
default = ["distribution-cargo"]
distribution-cargo = []
distribution-appimage = []
distribution-flatpak = []
distribution-macos-bundle = []
distribution-windows-portable = []
# Builds the `eov-console` launcher binary (Windows release packaging).
windows-console-launcher = []