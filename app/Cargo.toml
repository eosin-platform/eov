[package]
name = "eov"
version = "0.4.4"
edition = "2024"
authors = ["Thomas Havlik <me@thavlik.dev>"]
license = "MIT OR Apache-2.0 OR GPL-3.0"
description = "Main application for the EOV project, providing a Slint user interface and integrating various functionalities from the common crate."
keywords = ["wsi", "biology", "pathology", "medical", "histology"]
homepage = "https://eov.sh"
repository = "https://github.com/eosin-platform/eov"
readme = "README.md"
publish = true

[[bin]]
name = "eov"
path = "src/main.rs"

[dependencies]
# Common crate
eov-common = { path = "../common", version = "0.4.4" }

# Plugin API
eov-plugin-api = { path = "../plugin_api", version = "0.4.4" }

# Stable ABI for dynamic plugin loading
abi_stable = { version = "0.11", default-features = false }

# CLI parsing
clap = { version = "4.6", features = ["derive"] }

# Slint UI
slint = { version = "1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "unstable-wgpu-29",
    "unstable-winit-030",
] }

# Slint interpreter for runtime plugin UI loading
slint-interpreter = { version = "1.17.1", default-features = false, features = [
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg-wgpu",
    "internal",
    "internal-json",
] }

wgpu = { version = "28.0.0" }

# Image handling
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
sha2 = "0.10"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
natord = "1"

# File dialogs
rfd = "0.17.2"

# Thread-safe state
parking_lot = "0.12"

# Concurrent data structures
crossbeam-channel = "0.5.17"
dashmap = "6"
rayon = "1.12"

# CLI progress bars
indicatif = "0.18"

# Ctrl-C handling
ctrlc = "3"

# Clipboard
arboard = "3"

# Process management (for Open Containing Folder)
open = "5"

# Config directory access
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tar = "0.4"
semver = "1"

# GPU vertex buffer casting
bytemuck = { version = "1", features = ["derive"] }

# UUID for filter IDs
uuid = { version = "1", features = ["v4"] }

# Raw Vulkan bindings (same version as wgpu-hal uses internally)
ash = "0.38"

[target.'cfg(unix)'.dependencies]
# Unix domain socket fd passing (SCM_RIGHTS) for DMA-BUF
nix = { version = "0.29", features = ["socket", "uio"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
slint-build = "1.17.1"

[dev-dependencies]
tempfile = "3"
eovae = { path = "../plugins/eovae", default-features = false }
i-slint-backend-testing = { version = "1.17.1" }

[features]
default = ["distribution-cargo"]
distribution-cargo = []
distribution-appimage = []
distribution-flatpak = []
distribution-homebrew = []
distribution-windows-portable = []