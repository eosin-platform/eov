[package]
name = "eovae"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0 OR GPL-3.0-only"
description = "Variational-autoencoder reconstruction-error analysis for eov (ONNX models)"
repository = "https://github.com/eosin-platform/eov"

# eovae is built on its own (the eov workspace excludes it):
#   cargo build --release --manifest-path plugins/eovae/Cargo.toml
[workspace]

[lib]
# The library file must be named after the plugin id in plugin.toml.
name = "eovae"
crate-type = ["cdylib", "rlib"]

[features]
default = ["onnx"]
# ONNX Runtime inference. ONNX Runtime itself is loaded at run time (see the
# README); without this feature the plugin builds and its tests run with no
# ONNX Runtime at all, and every model reports that inference is unavailable.
onnx = ["dep:ort", "dep:libloading"]

[dependencies]
eov-plugin-api = { path = "../../plugin_api", version = "1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
half = "2"
# Persistent result cache (statically linked SQLite).
rusqlite = { version = "0.32", features = ["bundled"] }
# Optional compression of cached reconstructions.
miniz_oxide = "0.8"
# `load-dynamic`: the ONNX Runtime library is opened at run time, never
# linked, so one build works with CPU and GPU runtimes. `api-22` accepts
# ONNX Runtime 1.22 and newer.
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "load-dynamic",
    "api-22",
    "cuda",
    "half",
], optional = true }
# Reads the loaded runtime's version for run manifests (ort's own loader).
libloading = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 4
