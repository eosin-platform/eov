[workspace]
# Plugins are built on their own (each has its own workspace): they are
# separate products, three of them are git submodules, and none of them may
# be required to build or test the viewer. `plugin_api/example-plugin` is the
# in-tree plugin used as documentation and as the host's test fixture.
members = ["common", "app", "plugin_api", "plugin_api/example-plugin"]
exclude = [
    "plugins/annotations",
    "plugins/cellaris",
    "plugins/eovae",
    "plugins/gamepad",
]
resolver = "3"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "fs",
    "macros",
] }
# Error handling
anyhow = "1"
thiserror = "2"
# Logging
tracing = "0.1"
# Image processing
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
] }
# Thread-safe primitives
parking_lot = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
