[workspace]
# Plugins are built on their own (each has its own workspace): they are
# separate products, each a git submodule, and none of them may be required
# to build or test the viewer. `plugin_api/example-plugin` is the in-tree
# plugin used as documentation and as the host's test fixture.
members = ["common", "app", "plugin_api", "plugin_api/example-plugin"]
exclude = [
    "plugins/annotations",
    "plugins/cellaris",
    "plugins/gamepad",
    "plugins/vae",
]
resolver = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
