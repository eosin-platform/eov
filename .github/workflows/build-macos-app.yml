name: macOS

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-macos:
    name: Build macOS .app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # ---------------------------------------------------------------
    # Architecture matrix
    #
    # Each entry maps a target architecture to:
    #   runner           – GitHub-hosted runner label
    #   rust_target      – Rust target triple
    #   arch_label       – human-readable arch for artifact naming
    #
    # To add a new architecture, append another include entry.
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            arch_label: arm64

          - arch: x86_64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            arch_label: x86_64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cairo gdk-pixbuf glib jpeg-turbo libpng libtiff libxml2 meson ninja openjpeg pkg-config protobuf sqlite

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          artifact_name="eov-${tag}-macos-${{ matrix.arch_label }}.zip"
          checksum_name="${artifact_name}.sha256"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "checksum_name=$checksum_name"
          } >> "$GITHUB_OUTPUT"

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/macos/build.sh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RUST_TARGET: ${{ matrix.rust_target }}
          ARCH_LABEL: ${{ matrix.arch_label }}
          ARCHIVE_BASENAME: eov-${{ steps.meta.outputs.tag }}-macos-${{ matrix.arch_label }}
          DIST_DIR: ${{ github.workspace }}
          CREATE_ZIP: "1"
          CREATE_DMG: "0"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.meta.outputs.artifact_name }}
            ${{ steps.meta.outputs.checksum_name }}
