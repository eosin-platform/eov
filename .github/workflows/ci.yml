name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  # The release workflow runs this for the exact source commit and only
  # publishes when every job passed. It builds the packages itself, so it
  # sets build_packages to false.
  workflow_call:
    inputs:
      build_packages:
        description: "Also build the AppImage, macOS and Windows packages"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint-workflows:
    name: Workflows, scripts and packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install pinned linters
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          fetch() {
            curl -fsSL --retry 3 -o "$tools/$3" "$1"
            echo "$2  $tools/$3" | sha256sum --check --status || {
              echo "checksum mismatch for $1" >&2
              exit 1
            }
          }
          fetch https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 actionlint.tar.gz
          fetch https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 shellcheck.tar.xz
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          tar -xJf "$tools/shellcheck.tar.xz" -C "$tools" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils
      - name: actionlint
        run: actionlint
      - name: shellcheck
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          shellcheck --severity=warning \
            packaging/appimage/AppRun \
            packaging/appimage/*.sh \
            packaging/macos/build.sh \
            packaging/flatpak/build.sh \
            packaging/shared/build-openslide.sh \
            scripts/*.sh
      - name: Pins, notices and permissions
        run: python3 scripts/check_packaging.py
      - name: Desktop entry and AppStream metadata
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate assets/linux/io.eosin.eov.desktop
          appstreamcli validate --no-net assets/linux/io.eosin.eov.metainfo.xml

  python:
    name: Release tooling tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Unit tests
        working-directory: scripts
        run: python -m unittest discover -p 'test_*.py' -v

  check:
    name: Clippy and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            git \
            libcairo2-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libjpeg-turbo8-dev \
            libopenjp2-7-dev \
            libpng-dev \
            libsqlite3-dev \
            libtiff-dev \
            libudev-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libxml2-dev \
            libzstd-dev \
            meson \
            ninja-build \
            protobuf-compiler \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config \
            zlib1g-dev
      - name: Build OpenSlide from source
        shell: bash
        run: |
          set -euo pipefail
          openslide_prefix="$RUNNER_TEMP/openslide-prefix"
          OPENSLIDE_PREFIX="$openslide_prefix" \
          OPENSLIDE_BUILD_ROOT="$RUNNER_TEMP/openslide-build" \
            bash packaging/shared/build-openslide.sh

          {
            echo "OPENSLIDE_PREFIX=$openslide_prefix"
            echo "OPENSLIDE_LIB_DIR=$openslide_prefix/lib"
            echo "PKG_CONFIG_PATH=$openslide_prefix/lib/pkgconfig${PKG_CONFIG_PATH+:$PKG_CONFIG_PATH}"
            echo "LD_LIBRARY_PATH=$openslide_prefix/lib${LD_LIBRARY_PATH+:$LD_LIBRARY_PATH}"
            echo "LIBRARY_PATH=$openslide_prefix/lib${LIBRARY_PATH+:$LIBRARY_PATH}"
            echo "RUSTFLAGS=-L native=$openslide_prefix/lib ${RUSTFLAGS:-}"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Cargo Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Cargo Test
        env:
          # Every plugins/*/plugin.toml must be present and valid.
          EOV_REQUIRE_PLUGIN_MANIFESTS: '1'
        run: cargo test --locked --workspace --all-targets

  # The platform-specific updater code (the Windows helper hand-off, console
  # attach, Homebrew and bundle handling) is compiled and tested on its own
  # platform, not first at release time.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          components: clippy
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build OpenSlide and its MSVC import library
        id: openslide
        uses: ./.github/actions/openslide-windows
        with:
          msystem: CLANG64
          msys2-prefix: mingw-w64-clang-x86_64
          lib-machine: x64
      - name: Test eov and eov-update-helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:RUSTFLAGS = "-L native=${{ steps.openslide.outputs.lib-dir }}"
          $env:OPENSLIDE_LIB_DIR = "${{ steps.openslide.outputs.lib-dir }}"
          # The OpenSlide DLL and its dependencies, for the test binaries.
          $env:PATH = "${{ steps.openslide.outputs.msys-prefix }}\bin;$env:PATH"
          cargo test --locked -p eov --bins --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release -p eov --bin eov-console --features windows-console-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked -p eov --all-targets --features windows-console-launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install OpenSlide
        run: brew install openslide pkg-config
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test eov and eov-update-helper
        run: cargo test --locked -p eov --bins --tests
      - name: Clippy
        run: cargo clippy --locked -p eov --all-targets

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
      # install-action verifies the downloaded binaries against its own
      # checksum manifests.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit

  deny:
    name: Licences, bans and sources (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --all-features --config .github/deny.toml check licenses bans sources

  # The release packages, built exactly as a release builds them, with their
  # own checks: the AppImage's glibc floor and RUNPATH resolution, the macOS
  # bundle's otool linkage, minimum-version and helper smoke tests, and the
  # Windows zip's DLL and helper smoke tests.
  package-version:
    name: Package version
    if: inputs.build_packages != false
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("app/Cargo.toml", "rb"))["package"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  appimage:
    name: AppImage
    needs: package-version
    if: inputs.build_packages != false
    permissions:
      contents: read
    uses: ./.github/workflows/build-appimage.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.package-version.outputs.version }}
      tag: v${{ needs.package-version.outputs.version }}

  macos-bundle:
    name: macOS bundle
    needs: package-version
    if: inputs.build_packages != false
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos-app.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.package-version.outputs.version }}
      tag: v${{ needs.package-version.outputs.version }}

  windows-zip:
    name: Windows zip
    needs: package-version
    if: inputs.build_packages != false
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows-zip.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.package-version.outputs.version }}
      tag: v${{ needs.package-version.outputs.version }}
