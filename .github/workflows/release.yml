name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.4.6"
        required: true
        type: string

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.meta.outputs.source_sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_stable: ${{ steps.meta.outputs.is_stable }}
      default_branch: ${{ steps.meta.outputs.default_branch }}
      annotations_version: ${{ steps.meta.outputs.annotations_version }}
      gamepad_version: ${{ steps.meta.outputs.gamepad_version }}
      reuse_draft: ${{ steps.meta.outputs.reuse_draft }}
    steps:
      - name: Check out dispatched source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Validate version, source metadata, and release uniqueness
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ inputs.version }}"
          python3 scripts/release.py validate-source --kind eov --root . --version "$version"
          tag="v$version"
          source_sha="$GITHUB_SHA"

          tag_check_error="$RUNNER_TEMP/tag-check-error"
          set +e
          git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>"$tag_check_error"
          tag_status=$?
          set -e
          if [[ "$tag_status" -eq 0 ]]; then
            echo "tag '$tag' already exists" >&2
            exit 1
          elif [[ "$tag_status" -ne 2 ]]; then
            cat "$tag_check_error" >&2
            exit 1
          fi

          existing_releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")]")"
          existing_count="$(jq 'length' <<<"$existing_releases")"
          reuse_draft="false"
          if [[ "$existing_count" -gt 1 ]]; then
            echo "multiple GitHub Releases exist for '$tag'" >&2
            exit 1
          elif [[ "$existing_count" -eq 1 ]]; then
            existing_draft="$(jq -r '.[0].draft' <<<"$existing_releases")"
            existing_target="$(jq -r '.[0].target_commitish' <<<"$existing_releases")"
            if [[ "$existing_draft" != "true" ]]; then
              echo "published GitHub Release '$tag' already exists" >&2
              exit 1
            fi
            if [[ "$existing_target" != "$source_sha" ]]; then
              echo "existing draft '$tag' targets $existing_target, expected $source_sha" >&2
              exit 1
            fi
            reuse_draft="true"
          fi

          compatible_plugins="$(python3 scripts/release.py resolve-plugin-versions \
            --eov-version "$version" \
            --plugin annotations=eosin-platform/eov-annotations-plugin \
            --plugin gamepad=eosin-platform/eov-gamepad-plugin)"
          annotations_version="$(awk -F= '$1 == "annotations" { print $2 }' <<<"$compatible_plugins")"
          gamepad_version="$(awk -F= '$1 == "gamepad" { print $2 }' <<<"$compatible_plugins")"
          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          [[ "$annotations_version" =~ $semver_re ]] || {
            echo "latest annotations release has invalid version '$annotations_version'" >&2
            exit 1
          }
          [[ "$gamepad_version" =~ $semver_re ]] || {
            echo "latest gamepad release has invalid version '$gamepad_version'" >&2
            exit 1
          }

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          is_stable="false"
          if [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            is_stable="true"
          fi

          {
            echo "source_sha=$source_sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "is_stable=$is_stable"
            echo "default_branch=$default_branch"
            echo "annotations_version=$annotations_version"
            echo "gamepad_version=$gamepad_version"
            echo "reuse_draft=$reuse_draft"
          } >> "$GITHUB_OUTPUT"

  build-appimage:
    name: AppImage
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-appimage.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-flatpak:
    name: Flatpak
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-flatpak.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-windows:
    name: Windows
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-windows-zip.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  build-macos:
    name: macOS
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos-app.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}

  aggregate:
    name: Aggregate and validate artifacts
    needs: [prepare, build-appimage, build-flatpak, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          submodules: recursive
          token: ${{ github.token }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage artifacts and generate release.toml
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-files
          python3 scripts/release.py manifest \
            --kind eov \
            --root . \
            --version '${{ needs.prepare.outputs.version }}' \
            --repository eosin-platform/eov \
            --artifacts-dir artifacts \
            --staging-dir release-files \
            --output release-files/release.toml \
            --plugin-version annotations=${{ needs.prepare.outputs.annotations_version }} \
            --plugin-version gamepad=${{ needs.prepare.outputs.gamepad_version }}
          echo "Staged release files:"
          find release-files -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload validated release staging
        uses: actions/upload-artifact@v7
        with:
          name: eov-release-staging-${{ github.run_id }}
          path: release-files
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, aggregate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      manifest_artifact: eov-published-metadata-${{ github.run_id }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Download validated release staging
        uses: actions/download-artifact@v8
        with:
          name: eov-release-staging-${{ github.run_id }}
          path: release-files
          merge-multiple: true

      - name: Create or update draft release at SOURCE_SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ needs.prepare.outputs.reuse_draft }}' == 'true' ]]; then
            gh release upload '${{ needs.prepare.outputs.tag }}' release-files/* --clobber
          else
            gh release create '${{ needs.prepare.outputs.tag }}' \
              --target '${{ needs.prepare.outputs.source_sha }}' \
              --title '${{ needs.prepare.outputs.tag }}' \
              --generate-notes \
              --draft \
              release-files/*
          fi

      - name: Verify draft release target and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          source_sha='${{ needs.prepare.outputs.source_sha }}'
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$tag\")][0]")"
          [[ "$release_json" != "null" ]] || {
            echo "draft release $tag was not found" >&2
            exit 1
          }
          [[ "$(jq -r '.tag_name' <<<"$release_json")" == "$tag" ]] || {
            echo "draft release has an unexpected tag name" >&2
            exit 1
          }
          [[ "$(jq -r '.draft' <<<"$release_json")" == "true" ]] || {
            echo "release $tag is not a draft" >&2
            exit 1
          }
          draft_target="$(jq -r '.target_commitish' <<<"$release_json")"
          [[ "$draft_target" == "$source_sha" ]] || {
            echo "draft release $tag targets $draft_target, expected $source_sha" >&2
            exit 1
          }

          expected="$(find release-files -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit '${{ needs.prepare.outputs.tag }}' --draft=false

      - name: Verify published tag target
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.tag }}'
          source_sha='${{ needs.prepare.outputs.source_sha }}'
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag")"
          object_sha="$(jq -r '.object.sha' <<<"$ref_json")"
          object_type="$(jq -r '.object.type' <<<"$ref_json")"
          if [[ "$object_type" == "tag" ]]; then
            object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$object_sha" --jq .object.sha)"
          fi
          [[ "$object_sha" == "$source_sha" ]] || {
            echo "published tag $tag points at $object_sha, expected $source_sha" >&2
            exit 1
          }

      - name: Verify published asset URLs and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py verify-assets \
            --kind eov \
            --version '${{ needs.prepare.outputs.version }}' \
            --repository eosin-platform/eov \
            --manifest release-files/release.toml
          curl --fail --location --silent --show-error \
            "https://github.com/eosin-platform/eov/releases/download/${{ needs.prepare.outputs.tag }}/release.toml" \
            | cmp - release-files/release.toml

      - name: Export published manifest for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: eov-published-metadata-${{ github.run_id }}
          path: release-files/release.toml
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io packages
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$CARGO_REGISTRY_TOKEN" ]] || {
            echo "CARGO_REGISTRY_TOKEN is not configured" >&2
            exit 1
          }

          registry_version_status() {
            local crate="$1"
            local status
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")" || {
              echo "could not query crates.io for ${crate} ${VERSION}" >&2
              return 1
            }
            case "$status" in
              200|404)
                printf '%s\n' "$status"
                ;;
              *)
                echo "crates.io returned HTTP ${status} for ${crate} ${VERSION}" >&2
                return 1
                ;;
            esac
          }

          publish_crate() {
            local crate="$1"
            local status
            status="$(registry_version_status "$crate")"
            if [[ "$status" == "200" ]]; then
              echo "${crate} ${VERSION} is already published; skipping"
              return 0
            fi
            echo "Publishing ${crate} ${VERSION}"
            cargo publish --locked --package "$crate"
          }

          publish_crate eov-common
          publish_crate eov-plugin-api

          status="$(registry_version_status eov)"
          if [[ "$status" == "200" ]]; then
            echo "eov ${VERSION} is already published; skipping"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            echo "Publishing eov ${VERSION} (attempt ${attempt}/5)"
            if cargo publish --locked --package eov; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              echo "The eov-common/eov-plugin-api versions may still be propagating through the crates.io index; retrying."
              sleep 20
            fi
          done

          echo "failed to publish eov ${VERSION} after 5 attempts" >&2
          exit 1

  update-homebrew:
    name: Update Homebrew tap
    if: needs.prepare.outputs.is_stable == 'true'
    needs: [prepare, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      homebrew_tap_sha: ${{ steps.tap.outputs.homebrew_tap_sha }}
    steps:
      - name: Check out EOV release tooling
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: eov-source
          fetch-depth: 1
          token: ${{ github.token }}

      - name: Check out Homebrew tap
        uses: actions/checkout@v5
        with:
          repository: eosin-platform/homebrew-eov
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
          fetch-depth: 0

      - name: Download published manifest
        uses: actions/download-artifact@v8
        with:
          name: eov-published-metadata-${{ github.run_id }}
          path: release-metadata
          merge-multiple: true

      - name: Generate and validate casks
        shell: bash
        run: |
          set -euo pipefail
          python3 eov-source/scripts/release.py generate-cask \
            --version '${{ needs.prepare.outputs.version }}' \
            --manifest release-metadata/release.toml \
            --tap-root homebrew-tap \
            --info-plist eov-source/assets/macos/Info.plist
          python3 eov-source/scripts/release.py validate-casks \
            --version '${{ needs.prepare.outputs.version }}' \
            --manifest release-metadata/release.toml \
            --tap-root homebrew-tap
          ruby -c homebrew-tap/Casks/eov.rb
          ruby -c "homebrew-tap/Casks/eov@${{ needs.prepare.outputs.version }}.rb"

      - name: Audit casks with Homebrew when available
        working-directory: homebrew-tap
        shell: bash
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            brew audit --cask --strict --online \
              ./Casks/eov.rb \
              "./Casks/eov@${{ needs.prepare.outputs.version }}.rb"
          else
            echo "Homebrew is unavailable on this runner; Ruby validation was used."
          fi

      - name: Commit and push tap changes
        id: tap
        shell: bash
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version='${{ needs.prepare.outputs.version }}'
          git add -- Casks/eov.rb "Casks/eov@${version}.rb"
          staged="$(git diff --cached --name-only)"
          if [[ -n "$staged" ]]; then
            while IFS= read -r path; do
              case "$path" in
                Casks/eov.rb|"Casks/eov@${version}.rb") ;;
                *) echo "unexpected staged tap path: $path" >&2; exit 1 ;;
              esac
            done <<< "$staged"
            git commit -m "eov: update to ${version}"
            branch="$(git branch --show-current)"
            git push origin "HEAD:${branch}"
          fi
          HOMEBREW_TAP_SHA="$(git rev-parse HEAD)"
          echo "homebrew_tap_sha=$HOMEBREW_TAP_SHA" >> "$GITHUB_OUTPUT"

  post-release:
    name: Commit EOV install metadata
    if: needs.prepare.outputs.is_stable == 'true'
    needs: [prepare, update-homebrew]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out current EOV default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.default_branch }}
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Download published manifest
        uses: actions/download-artifact@v8
        with:
          name: eov-published-metadata-${{ github.run_id }}
          path: release-metadata
          merge-multiple: true

      - name: Update and validate README
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release.py update-readme \
            --version '${{ needs.prepare.outputs.version }}' \
            --manifest release-metadata/release.toml \
            --readme README.md
          python3 scripts/release.py validate-readme \
            --version '${{ needs.prepare.outputs.version }}' \
            --manifest release-metadata/release.toml \
            --readme README.md

      - name: Advance Homebrew submodule gitlink
        shell: bash
        run: |
          set -euo pipefail
          tap_sha='${{ needs.update-homebrew.outputs.homebrew_tap_sha }}'
          git submodule update --init packaging/homebrew-eov
          git -C packaging/homebrew-eov fetch --no-tags origin
          if ! git -C packaging/homebrew-eov cat-file -e "${tap_sha}^{commit}"; then
            git -C packaging/homebrew-eov fetch --no-tags origin "$tap_sha"
          fi
          git -C packaging/homebrew-eov checkout --detach "$tap_sha"
          git add -- README.md packaging/homebrew-eov

      - name: Commit and push post-release metadata
        shell: bash
        run: |
          set -euo pipefail
          staged="$(git diff --cached --name-only)"
          if [[ -n "$staged" ]]; then
            while IFS= read -r path; do
              case "$path" in
                README.md|packaging/homebrew-eov) ;;
                *) echo "unexpected staged post-release path: $path" >&2; exit 1 ;;
              esac
            done <<< "$staged"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "release: update install metadata for ${{ needs.prepare.outputs.version }}"
            branch='${{ needs.prepare.outputs.default_branch }}'
            if ! git push origin "HEAD:${branch}"; then
              git fetch origin "$branch"
              git rebase "origin/$branch"
              git push origin "HEAD:${branch}"
            fi
          else
            echo "README and Homebrew gitlink already match; no post-release commit needed"
          fi