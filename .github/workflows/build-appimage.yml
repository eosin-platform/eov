name: AppImage

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    # Built in an EL8 container (glibc 2.28), so the AppImage runs on every
    # distribution with glibc 2.28 or newer (RHEL/Rocky/Alma 8+, Debian 10+,
    # Ubuntu 18.10+); the build fails if anything needs a newer glibc. The
    # image is pinned by digest (multi-arch index).
    container:
      image: almalinux:8@sha256:8b469a3a78515e8a18ea8fc727e6a3679e1d0c5ba6f58d5b30be3d0d9b86cffe

    # ---------------------------------------------------------------
    # Architecture matrix
    #
    #   runner           – GitHub-hosted runner label (native, because
    #                      dependency bundling resolves host-arch libraries)
    #   rust_target      – Rust target triple
    #   artifact_arch    – arch slug in the artifact name
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            artifact_arch: x86_64

          # NOTE: Requires GitHub Actions ARM runner access.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            artifact_arch: arm64

    steps:
      # actions/checkout needs git for submodules; the rest of the build
      # dependencies come from the checked-out script.
      - name: Install git
        shell: bash
        run: dnf -y install git-core

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: packaging/appimage/install-build-deps-el8.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: el8-${{ matrix.arch }}

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          artifact_name="eov-${tag}-linux-${{ matrix.artifact_arch }}.AppImage"
          {
            echo "artifact_name=$artifact_name"
            echo "checksum_name=${artifact_name}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Download pinned AppImage tooling
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tool_env="$(packaging/appimage/fetch-tools.sh "$RUNNER_TEMP/appimage-tools")"
          printf '%s\n' "$tool_env" >> "$GITHUB_ENV"

      - name: Build AppImage
        shell: bash
        env:
          # appimagetool is itself an AppImage; containers have no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APPIMAGE_MAX_GLIBC: '2.28'
          APPIMAGE_REQUIRE_LICENSES: '1'
          ARCH: ${{ matrix.arch }}
          OUTPUT_PATH: ${{ github.workspace }}/dist/${{ steps.meta.outputs.artifact_name }}
        run: |
          set -euo pipefail
          ./packaging/appimage/build.sh

      - name: Generate checksum
        shell: bash
        env:
          ARTIFACT: ${{ steps.meta.outputs.artifact_name }}
          CHECKSUM: ${{ steps.meta.outputs.checksum_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$ARTIFACT" > "$CHECKSUM"
          cat "$CHECKSUM"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.meta.outputs.artifact_name }}
            dist/${{ steps.meta.outputs.checksum_name }}
          if-no-files-found: error
