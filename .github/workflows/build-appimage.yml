name: AppImage

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # ---------------------------------------------------------------
    # Architecture matrix
    #
    # Each entry maps a target architecture to:
    #   runner           – GitHub-hosted runner label
    #   rust_target      – Rust target triple (for cargo / rustup)
    #   appimage_arch    – arch slug used in linuxdeploy & appimagetool
    #                      download URLs and the ARCH env var expected
    #                      by appimagetool
    #
    # To add a new architecture, append another include entry.
    # Native runners are used because AppImage dependency bundling
    # (ldd, linuxdeploy) must resolve host-arch shared libraries.
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            appimage_arch: x86_64
            artifact_arch: x86_64

          # NOTE: Requires GitHub Actions ARM runner access.
          # If unavailable, remove this entry and build arm64 AppImages
          # on a self-hosted ARM64 runner or via QEMU (significantly slower).
          - arch: aarch64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            appimage_arch: aarch64
            artifact_arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cargo \
            curl \
            file \
            git \
            libcairo2-dev \
            libvulkan-dev \
            libfontconfig-dev \
            libgdk-pixbuf-2.0-dev \
            libglib2.0-dev \
            libjpeg-turbo8-dev \
            libopenjp2-7-dev \
            libpng-dev \
            libsqlite3-dev \
            libtiff-dev \
            libudev-dev \
            libxml2-dev \
            meson \
            ninja-build \
            protobuf-compiler \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            pkg-config \
            squashfs-tools \
            zlib1g-dev \
            zsync

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          # Architecture comes from the matrix, not uname.
          arch="${{ matrix.arch }}"
          artifact_arch="${{ matrix.artifact_arch }}"
          artifact_name="eov-${tag}-linux-${artifact_arch}.AppImage"
          checksum_name="${artifact_name}.sha256"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "arch=$arch"
            echo "artifact_name=$artifact_name"
            echo "checksum_name=$checksum_name"
          } >> "$GITHUB_OUTPUT"

      - name: Download AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          # Architecture-specific AppImage tooling downloads.
          curl -fsSL -o "$HOME/.local/bin/linuxdeploy" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.appimage_arch }}.AppImage"
          curl -fsSL -o "$HOME/.local/bin/appimagetool" \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"

          chmod +x "$HOME/.local/bin/linuxdeploy" "$HOME/.local/bin/appimagetool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # Passed through to build.sh and appimagetool to select the
          # correct architecture for the output AppImage.
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/appimage/build.sh

      - name: Rename artifact and generate checksum
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          artifacts=(dist/*.AppImage)
          if [[ "${#artifacts[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage artifact in dist/, found ${#artifacts[@]}" >&2
            ls -la dist >&2 || true
            exit 1
          fi

          artifact_path="dist/${{ steps.meta.outputs.artifact_name }}"
          mv "${artifacts[0]}" "$artifact_path"
          cd dist
          sha256sum ${{ steps.meta.outputs.artifact_name }} > "${{ steps.meta.outputs.checksum_name }}"
          cd ..

          {
            echo "artifact_path=$artifact_path"
            echo "checksum_path=dist/${{ steps.meta.outputs.checksum_name }}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.bundle.outputs.artifact_path }}
            ${{ steps.bundle.outputs.checksum_path }}