name: Windows

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
    secrets:
      WINDOWS_CERTIFICATE_PFX:
        description: "Base64 of the Authenticode code-signing certificate (.pfx); optional"
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        description: "Password of the .pfx; optional"
        required: false
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-windows:
    name: Build Windows zip (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    # ---------------------------------------------------------------
    # Architecture matrix
    #
    # Each entry maps a target architecture to:
    #   runner           – GitHub-hosted runner label
    #   msvc_arch        – MSVC /arch parameter for ilammy/msvc-dev-cmd
    #   msystem          – MSYS2 environment (CLANG64 or CLANGARM64)
    #   msys2_prefix     – MSYS2 package name prefix
    #   lib_machine      – MSVC lib.exe /machine target
    #   rust_target      – Rust target triple
    #   ntldd_filter     – grep pattern for ntldd output to find
    #                      non-system DLLs from the MSYS2 environment
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            msvc_arch: x64
            msystem: CLANG64
            msys2_prefix: mingw-w64-clang-x86_64
            lib_machine: x64
            rust_target: x86_64-pc-windows-msvc
            ntldd_filter: clang64

          # NOTE: Requires GitHub Actions ARM64 Windows runner access.
          - arch: arm64
            runner: windows-11-arm
            msvc_arch: arm64
            msystem: CLANGARM64
            msys2_prefix: mingw-w64-clang-aarch64
            lib_machine: arm64
            rust_target: aarch64-pc-windows-msvc
            ntldd_filter: clangarm64

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1 (master)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.arch }}

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          artifact_name="eov-${tag}-windows-${{ matrix.arch }}.zip"
          checksum_name="${artifact_name}.sha256"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "artifact_name=$artifact_name"
            echo "checksum_name=$checksum_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build OpenSlide and its MSVC import library
        id: openslide
        uses: ./.github/actions/openslide-windows
        with:
          msystem: ${{ matrix.msystem }}
          msys2-prefix: ${{ matrix.msys2_prefix }}
          lib-machine: ${{ matrix.lib_machine }}

      - name: Build release binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $libDir = "${{ steps.openslide.outputs.lib-dir }}"
          $env:RUSTFLAGS = "-L native=$libDir"
          $env:OPENSLIDE_LIB_DIR = $libDir
          cargo build --release --locked --target ${{ matrix.rust_target }} `
            --bin eov --bin eov-update-helper --bin eov-console `
            --no-default-features --features "distribution-windows-portable windows-console-launcher"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect runtime DLLs and their licences
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p staging/eov/licenses/third-party

          openslide_dll=$(find "$MSYSTEM_PREFIX/bin" -maxdepth 1 -name 'libopenslide-*.dll' -type f | head -1)
          [[ -n "$openslide_dll" ]] || { echo "No OpenSlide DLL found in $MSYSTEM_PREFIX/bin" >&2; exit 1; }
          echo "Resolving dependencies for: $openslide_dll"
          cp "$openslide_dll" staging/eov/

          # ntldd: every non-system DLL OpenSlide needs, recursively.
          mapfile -t dependencies < <(
            ntldd -R "$openslide_dll" \
              | grep -i "${{ matrix.ntldd_filter }}" \
              | awk '{print $3}' \
              | sort -u
          )
          for dep in "${dependencies[@]}"; do
            dep="$(cygpath -u "$dep")"
            echo "  copying: $(basename "$dep")"
            cp "$dep" staging/eov/
            # The MSYS2 package's licence files (share/licenses/<package>).
            package="$(pacman -Qoq "$dep" 2>/dev/null || true)"
            if [[ -n "$package" && -d "$MSYSTEM_PREFIX/share/licenses/${package#${{ matrix.msys2_prefix }}-}" ]]; then
              cp -r "$MSYSTEM_PREFIX/share/licenses/${package#${{ matrix.msys2_prefix }}-}" \
                "staging/eov/licenses/third-party/"
            elif [[ -n "$package" ]]; then
              echo "  note: $package ships no licence directory"
            fi
          done
          build_root="$(cygpath -u "$RUNNER_TEMP")/openslide-build"
          for source in "$build_root/openslide-src" "$build_root"/libdicom-src/libdicom-*; do
            [[ -d "$source" ]] || continue
            name="$(basename "$source")"
            mkdir -p "staging/eov/licenses/third-party/${name%-src}"
            cp "$source"/COPYING* "$source"/LICENSE* "staging/eov/licenses/third-party/${name%-src}/" 2>/dev/null || true
          done

          echo "DLLs collected:"
          ls -1 staging/eov/*.dll
          echo "Licence directories:"
          ls -1 staging/eov/licenses/third-party

      - name: Stage binaries, licences and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "target\${{ matrix.rust_target }}\release"
          Copy-Item "$out\eov.exe" "staging\eov\"
          Copy-Item "$out\eov-update-helper.exe" "staging\eov\"
          # The console launcher: `eov ...` in a terminal resolves to eov.com
          # (PATHEXT lists .COM before .EXE), which runs eov.exe attached to
          # the console and waits for it (app/src/win_console_launcher.rs).
          Copy-Item "$out\eov-console.exe" "staging\eov\eov.com"

          # Licence texts next to the binaries (LGPL compliance for the
          # bundled OpenSlide and its dependencies).
          Copy-Item "LICENSE-MIT","LICENSE-APACHE-2.0","LICENSE-GPLv3" "staging\eov\"
          Copy-Item "assets\COPYING.third-party" "staging\eov\THIRD-PARTY-NOTICES.txt"
          Copy-Item "assets\licenses\LGPL-2.1.txt" "staging\eov\licenses\"

      - name: Sign binaries (Authenticode)
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:WINDOWS_CERTIFICATE_PFX) {
            Write-Host "No WINDOWS_CERTIFICATE_PFX secret; the binaries stay unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          try {
            # signtool picks the signing format from the file extension, so
            # eov.com is signed under its build name and copied again.
            $out = "target\${{ matrix.rust_target }}\release"
            Copy-Item "$out\eov-console.exe" "$env:RUNNER_TEMP\eov-console.exe"
            $files = @("staging\eov\eov.exe", "staging\eov\eov-update-helper.exe", "$env:RUNNER_TEMP\eov-console.exe")
            signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
              /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD $files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            signtool verify /pa /all $files
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item "$env:RUNNER_TEMP\eov-console.exe" "staging\eov\eov.com" -Force
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # A missing DLL or a helper that cannot run on its own would only show
      # up on users' machines otherwise. eov.exe runs with redirected
      # handles (so errors go to stderr, not a dialog) and a timeout.
      - name: Smoke-test the staged binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Checked([string]$exe, [string[]]$arguments) {
            $stdout = Join-Path $env:RUNNER_TEMP "smoke-out.txt"
            $stderr = Join-Path $env:RUNNER_TEMP "smoke-err.txt"
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -NoNewWindow -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw "$exe $arguments timed out"
            }
            Get-Content $stdout, $stderr | Write-Host
            if ($process.ExitCode -ne 0) {
              throw "$exe $arguments exited with $($process.ExitCode)"
            }
          }
          Invoke-Checked (Resolve-Path "staging\eov\eov.exe") @("--version")
          Invoke-Checked (Resolve-Path "staging\eov\eov.com") @("--version")
          # The updater copies the helper into a private temporary directory
          # and runs it from there.
          $helperDir = Join-Path $env:RUNNER_TEMP "helper-smoke"
          New-Item -ItemType Directory -Force $helperDir | Out-Null
          Copy-Item "staging\eov\eov-update-helper.exe" $helperDir
          Invoke-Checked (Join-Path $helperDir "eov-update-helper.exe") @("--self-test")

      - name: Create zip archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Manifest of every shipped file. The self-updater refuses to replace
          # a folder that contains anything not listed here, so extracting eov
          # into a shared folder (Downloads, Desktop) can never lose user files.
          $files = Get-ChildItem -Path staging\eov -File -Recurse | ForEach-Object {
            $_.FullName.Substring((Resolve-Path "staging\eov").Path.Length + 1).Replace('\', '/')
          }
          $files += "eov-portable.json"
          @{ version = "${{ steps.meta.outputs.version }}"; files = @($files | Sort-Object) } |
            ConvertTo-Json -Depth 3 | Set-Content "staging\eov\eov-portable.json" -Encoding UTF8

          Write-Host "Zip contents:"
          Get-ChildItem -Path staging\eov | Format-Table Name, Length

          # Archive the folder itself so the zip extracts into eov\ instead of
          # scattering files into the destination directory.
          $archiveSource = (Resolve-Path "staging\eov").Path
          if (Test-Path "${{ steps.meta.outputs.artifact_name }}") {
            Remove-Item "${{ steps.meta.outputs.artifact_name }}" -Force
          }
          Compress-Archive -Path $archiveSource -DestinationPath "${{ steps.meta.outputs.artifact_name }}"

          $hash = (Get-FileHash "${{ steps.meta.outputs.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ steps.meta.outputs.artifact_name }}" | Set-Content "${{ steps.meta.outputs.checksum_name }}" -Encoding ASCII -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-files-${{ matrix.arch }}
          path: |
            ${{ steps.meta.outputs.artifact_name }}
            ${{ steps.meta.outputs.checksum_name }}
          if-no-files-found: error
