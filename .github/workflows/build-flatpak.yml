name: Flatpak

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-flatpak:
    name: Release Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}

    # ---------------------------------------------------------------
    # Architecture matrix
    #
    # Each entry maps a target architecture to a GitHub-hosted runner.
    # flatpak-builder builds for the host architecture by default, so
    # native runners are the simplest path — no QEMU, no --arch flag.
    #
    # To add a new architecture, append another include entry with the
    # corresponding runner label.
    #
    # Alternative for aarch64 without a native runner:
    #   flatpak-builder --arch=aarch64 with QEMU binfmt_misc, but
    #   Rust compilation under user-mode emulation is extremely slow.
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            artifact_arch: x86_64

          # NOTE: Requires GitHub Actions ARM runner access.
          # If unavailable, remove this entry and build on a self-hosted
          # ARM64 runner or investigate QEMU-based cross-build.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact_arch: arm64

    env:
      APP_ID: io.eosin.eov

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            python3 \
            python3-venv

      - name: Create Python virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install aiohttp PyYAML tomlkit

      - name: Install Flatpak runtimes
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Installs the correct arch variant automatically on native runners.
          flatpak install --user -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          # Architecture comes from the matrix; on native runners this
          # matches what flatpak --default-arch would return.
          arch="${{ matrix.arch }}"
          artifact_arch="${{ matrix.artifact_arch }}"
          bundle_name="eov-${tag}-linux-${artifact_arch}.flatpak"
          checksum_name="${bundle_name}.sha256"

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "arch=$arch"
            echo "bundle_name=$bundle_name"
            echo "checksum_name=$checksum_name"
          } >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/flatpak/build.sh

      - name: Create Flatpak bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak build-export repo build stable
          flatpak build-bundle \
            repo \
            "${{ steps.meta.outputs.bundle_name }}" \
            "${{ env.APP_ID }}" \
            stable
          sha256sum "${{ steps.meta.outputs.bundle_name }}" > "${{ steps.meta.outputs.checksum_name }}"

          echo "bundle_path=${{ steps.meta.outputs.bundle_name }}" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${{ steps.meta.outputs.checksum_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.bundle_name }}
          path: |
            ${{ steps.bundle.outputs.bundle_path }}
            ${{ steps.bundle.outputs.checksum_path }}