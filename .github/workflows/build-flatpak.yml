name: Flatpak

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to build"
        required: true
        type: string
      version:
        description: "Release version without the v prefix"
        required: true
        type: string
      tag:
        description: "Release tag"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-flatpak:
    name: Release Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    # ---------------------------------------------------------------
    # Architecture matrix: flatpak-builder builds for the host
    # architecture, so native runners are used.
    # ---------------------------------------------------------------
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            artifact_arch: x86_64

          # NOTE: Requires GitHub Actions ARM runner access.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            artifact_arch: arm64

    env:
      APP_ID: io.eosin.eov

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive
          persist-credentials: false

      # The manifest requests --device=input, which `flatpak build-finish`
      # only accepts from Flatpak 1.15.6; Ubuntu 24.04 ships 1.14. The
      # Flatpak maintainers' PPA provides current releases.
      - name: Install Flatpak tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:flatpak/stable
          sudo apt-get update
          sudo apt-get install -y \
            flatpak \
            flatpak-builder \
            python3 \
            python3-venv
          version="$(flatpak --version | awk '{print $2}')"
          echo "Flatpak $version"
          if [[ "$(printf '%s\n%s\n' 1.15.6 "$version" | sort -V | head -n 1)" != "1.15.6" ]]; then
            echo "Flatpak $version is older than 1.15.6 and rejects --device=input" >&2
            exit 1
          fi

      - name: Create Python virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install aiohttp PyYAML tomlkit

      - name: Install Flatpak runtimes
        shell: bash
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # Installs the correct arch variant automatically on native runners.
          flatpak install --user -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          tag="${{ inputs.tag }}"

          [[ "$tag" == "v$version" ]] || {
            echo "tag '$tag' does not match version '$version'" >&2
            exit 1
          }

          bundle_name="eov-${tag}-linux-${{ matrix.artifact_arch }}.flatpak"
          {
            echo "bundle_name=$bundle_name"
            echo "checksum_name=${bundle_name}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        shell: bash
        run: |
          set -euo pipefail
          ./packaging/flatpak/build.sh

      - name: Check the exported permissions
        shell: bash
        run: |
          set -euo pipefail
          cat build/metadata
          grep -Eq '^shared=.*network' build/metadata || { echo "network is not shared" >&2; exit 1; }
          grep -Eq '^devices=.*input' build/metadata || { echo "input devices are not granted" >&2; exit 1; }
          test -f build/files/share/licenses/io.eosin.eov/licenses/LGPL-2.1.txt
          test -f build/files/share/doc/eov/COPYING.third-party

      - name: Create Flatpak bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak build-export repo build stable
          flatpak build-bundle \
            repo \
            "${{ steps.meta.outputs.bundle_name }}" \
            "${{ env.APP_ID }}" \
            stable
          sha256sum "${{ steps.meta.outputs.bundle_name }}" > "${{ steps.meta.outputs.checksum_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.bundle_name }}
          path: |
            ${{ steps.meta.outputs.bundle_name }}
            ${{ steps.meta.outputs.checksum_name }}
          if-no-files-found: error
