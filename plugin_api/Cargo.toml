[package]
name = "eov-plugin-api"
version = "0.4.1"
edition = "2024"
description = "Shared plugin API for EOV plugins"
license = "MIT OR Apache-2.0 OR GPL-3.0"
homepage = "https://eov.sh"
repository = "https://github.com/eosin-platform/eov"
keywords = ["wsi", "biology", "pathology", "medical", "histology"]

[dependencies]
abi_stable = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
